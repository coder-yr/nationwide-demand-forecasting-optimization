[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nationwide-demand-forecasting"
version = "1.0.0"
description = "Nationwide Demand Forecasting and Inventory Optimization Platform"
authors = [{ name = "Principal AI Engineer" }]
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

