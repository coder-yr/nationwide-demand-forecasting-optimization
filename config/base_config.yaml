# Global Configuration for Nationwide Demand Forecasting and Inventory Optimization
project:
  name: "nationwide-demand-forecasting"
  version: "1.0.0"
  random_seed: 42

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  outputs_dir: "data/outputs"
  calendar_file: "data/raw/calendar.csv"
  sales_file: "data/raw/sales_train_evaluation.csv"
  prices_file: "data/raw/sell_prices.csv"
  processed_parquet: "data/processed/m5_panel_downcasted.parquet"
  store_partition_dir: "data/processed/stores"

hierarchy:
  states: ["CA", "TX", "WI"]
  stores: ["CA_1", "CA_2", "CA_3", "CA_4", "TX_1", "TX_2", "TX_3", "WI_1", "WI_2", "WI_3"]
  categories: ["FOODS", "HOBBIES", "HOUSEHOLD"]
  total_series_bottom: 30490
  forecast_horizon_days: 28

features:
  min_lag_days: 28
  lag_offsets: [28, 29, 30, 35, 42, 56]
  rolling_windows: [7, 14, 28, 60]
  ewma_alphas: [0.1, 0.3]
  use_price_elasticity: true
  use_snap_indicators: true
  use_calendar_events: true

models:
  lgbm:
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 50
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    tweedie_variance_power: 1.15
    quantiles: [0.10, 0.50, 0.90]
    n_estimators: 400
    early_stopping_rounds: 30
  tft:
    max_epochs: 15
    batch_size: 64
    learning_rate: 0.001
    hidden_size: 32
    attention_heads: 4
    dropout: 0.1
    quantiles: [0.10, 0.50, 0.90]
    pareto_top_k: 250
  prophet:
    yearly_seasonality: true
    weekly_seasonality: true
    daily_seasonality: false
    interval_width: 0.80

optimization:
  service_level_target: 0.95
  default_lead_time_days: 3
  lead_time_std: 0.5
  default_moq: 12
  holding_cost_rate_annual: 0.20
  stockout_penalty_multiplier: 1.5
  daily_store_budget_dollars: 25000.0
  store_max_capacity_m3: 1500.0
  time_limit_seconds: 60

